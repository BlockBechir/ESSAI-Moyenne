<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Calculateur de moyenne pondérée ESSAI — 1ère, 2ème et 3ème année.">
  <title>Moyenne ESSAI</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 64 64" width="40" height="40" aria-hidden="true">
        <rect width="64" height="64" rx="14" fill="#151a21"/>
        <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="13.25" fill="none" stroke="#38424f" stroke-width="1.5"/>
        <g fill="#2c6cb9">
          <rect x="12" y="34" width="7" height="16" rx="1.2"/>
          <rect x="23" y="26" width="7" height="24" rx="1.2"/>
          <rect x="34" y="20" width="7" height="30" rx="1.2"/>
          <rect x="45" y="29" width="7" height="21" rx="1.2"/>
        </g>
        <path d="M12 24.5h40" fill="none" stroke="#7ab6ff" stroke-width="2" stroke-linecap="round"/>
        <circle cx="32" cy="24.5" r="2.4" fill="#e7ebf0"/>
      </svg>
      <div>
        <p class="brand-kicker" id="brand-kicker">ESSAI · 1ère année</p>
        <h1>Moyenne pondérée</h1>
      </div>
    </div>
    <label class="theme-toggle" for="theme" title="Basculer le thème">
      <span class="theme-icon theme-icon-light" aria-hidden="true">☀</span>
      <input type="checkbox" id="theme" class="switch" checked>
      <span class="theme-icon theme-icon-dark" aria-hidden="true">☾</span>
      <span class="visually-hidden">Thème sombre</span>
    </label>
  </header>

  <nav class="year-tabs" role="tablist" aria-label="Année d’études">
    <button type="button" class="year-tab" role="tab" data-year="1">1ère année</button>
    <button type="button" class="year-tab" role="tab" data-year="2">2ème année</button>
    <button type="button" class="year-tab" role="tab" data-year="3">3ème année</button>
  </nav>

  <div class="layout">
    <main>
      <form id="calculator" autocomplete="off" novalidate>
        <div id="paniers"></div>
      </form>
    </main>

    <aside class="summary" aria-live="polite">
      <div class="summary-card">
        <p class="summary-label">Moyenne générale</p>
        <p class="summary-value" id="overall-average">—</p>
        <p class="summary-meta" id="overall-meta">Aucun module saisi</p>
        <div class="summary-bar" aria-hidden="true">
          <span id="overall-bar"></span>
        </div>
        <div class="summary-total">
          <span class="summary-total-label">Moyenne totale <small>(vides = 0)</small></span>
          <span class="summary-total-value" id="overall-total">—</span>
        </div>
        <p class="need" id="overall-need" hidden></p>
      </div>

      <ul class="panier-list" id="panier-summary"></ul>

      <div class="summary-actions">
        <button type="button" id="reset" class="btn">Effacer les notes de l’année</button>
      </div>
    </aside>
  </div>

  <footer class="site-footer">
    <p>Moyenne : Σ (note × coef) / Σ coef, modules renseignés uniquement.
       Moyenne totale : Σ (note × coef) / coef total, modules vides comptés 0.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
